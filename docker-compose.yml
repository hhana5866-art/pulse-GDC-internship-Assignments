# Optional. Everything here is a convenience, not a requirement.
#
# If you already run PostgreSQL, Redis or a mail server locally, use yours
# and point your configuration at it instead. Nothing in the project depends
# on this file.
#
#   docker compose up -d          start everything
#   docker compose ps             see what is running
#   docker compose down           stop it
#   docker compose down -v        stop it and delete the database volume
#
# Mail inbox: http://localhost:8025

services:

  postgres:
    image: postgres:16-alpine
    container_name: otp-postgres
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: registration
      POSTGRES_PASSWORD: registration
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registration -d registration"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: otp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A mail server that accepts everything and delivers nothing.
  # SMTP on 1025, and a web inbox on 8025 where your messages show up.
  mailpit:
    image: axllent/mailpit:latest
    container_name: otp-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
